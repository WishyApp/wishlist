name: Update Goldens

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update goldens on'
        required: true
        default: 'main'

jobs:
  update-goldens:
    name: Regenerate Golden Files
    runs-on: ubuntu-latest
    # Needed to push the regenerated golden files and to mark the pushed
    # commit as tested
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Update golden files
        run: flutter test --update-goldens

      # flutter test --update-goldens runs the whole suite: this run is the
      # test of the checked out commit, with the goldens it produces.
      - name: Commit and push goldens
        uses: ./.github/actions/commit-goldens
        with:
          branch: ${{ github.event.inputs.branch }}
          tested-sha: ${{ steps.checkout.outputs.commit }}
          token: ${{ github.token }}
