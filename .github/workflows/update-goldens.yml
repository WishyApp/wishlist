name: Update Goldens

on:
  workflow_dispatch:
    inputs:
      # No default: the commit carries the skip marker, which must never
      # reach main (main gets its goldens through the PRs).
      branch:
        description: 'PR branch to update goldens on (not main)'
        required: true

jobs:
  update-goldens:
    name: Regenerate Golden Files
    runs-on: ubuntu-latest
    # Needed to push the regenerated golden files and to mark the pushed
    # commit as tested
    permissions:
      contents: write
      statuses: write
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Refuse main
        if: github.event.inputs.branch == 'main'
        run: |
          echo "::error::Run this workflow on a PR branch: main gets its goldens through the PRs"
          exit 1

      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Update golden files
        run: flutter test --update-goldens

      # flutter test --update-goldens runs the whole test suite: this run is
      # the test of the checked out commit, with the goldens it produces.
      - name: Commit and push goldens
        uses: ./.github/actions/commit-goldens
        with:
          branch: ${{ github.event.inputs.branch }}
          tested-sha: ${{ steps.checkout.outputs.commit }}
          token: ${{ github.token }}
          # Only the tests run here, not the analysis of ci.yml
          status-context: Tests (goldens)
