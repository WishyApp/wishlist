name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'

# Évite les runs en doublon et annule les anciens runs si un nouveau commit est pushé
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
 
jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      # Generated files are committed: fail if they are out of date with
      # their sources (models, providers, routes, assets). l10n files were
      # already regenerated by flutter pub get (generate: true). They are
      # formatted before the comparison, so that the result only depends on
      # the formatter of this Flutter version, already enforced above.
      - name: Check generated files are up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib >/dev/null
          cd ..
          generated=(
            ':(glob)wishlist/lib/**/*.g.dart'
            ':(glob)wishlist/lib/**/*.freezed.dart'
            'wishlist/lib/gen'
            ':(glob)wishlist/lib/l10n/arb/app_localizations*.dart'
          )
          changed="$(git status --porcelain -- "${generated[@]}")"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- "${generated[@]}"
            echo "::error::Generated files are out of date: run flutter pub get, then dart run build_runner build --delete-conflicting-outputs, and commit the files listed above."
            exit 1
          fi

      - name: Analyze code
        run: flutter analyze

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needed to push the regenerated golden files
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests & update goldens
        run: flutter test --update-goldens --coverage

      - name: Coverage summary
        run: |
          awk -F: '/^LF:/ { found += $2 } /^LH:/ { hit += $2 }
            END { printf "### Coverage\n%.1f%% of lines (%d / %d)\n", (found ? 100 * hit / found : 0), hit, found }' \
            coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: wishlist/coverage/lcov.info
          retention-days: 14

      - name: Check for golden changes
        id: goldens
        run: |
          cd ..
          if git diff --quiet -- ':(glob)wishlist/test/**/preview/*.png'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated goldens
        if: steps.goldens.outputs.changed == 'true'
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'wishlist/test/**/preview/*.png'
          git commit -m "test: update golden files [skip ci]"
          git push

      - name: Re-run tests to validate updated goldens
        if: steps.goldens.outputs.changed == 'true'
        run: flutter test
