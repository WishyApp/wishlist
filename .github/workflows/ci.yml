name: CI

# Only the Flutter app is built here: changes limited to site/, docs/,
# supabase/ (see supabase.yml) or the changelog do not need this workflow.
on:
  push:
    branches:
      - main
    paths:
      - 'wishlist/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'
    paths:
      - 'wishlist/**'
      - '.github/workflows/ci.yml'

# Évite les runs en doublon et annule les anciens runs si un nouveau commit est pushé
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# Golden files, as a git pathspec from the repository root.
env:
  GOLDENS: ':(glob)wishlist/test/**/preview/*.png'

jobs:
  # Analysis and tests share one job: Flutter is set up once, and each job
  # is billed rounded up to the minute.
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Read-only: on main this job runs the whole test suite; pushing the
    # regenerated goldens of a PR is left to commit-goldens.
    permissions:
      contents: read
    outputs:
      goldens-changed: ${{ steps.goldens.outputs.changed }}
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      # Generated files are committed: fail if they are out of date with
      # their sources (models, providers, routes, assets). l10n files were
      # already regenerated by flutter pub get (generate: true). They are
      # formatted before the comparison, so that the result only depends on
      # the formatter of this Flutter version, already enforced above.
      - name: Check generated files are up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart format lib >/dev/null
          cd ..
          generated=(
            ':(glob)wishlist/lib/**/*.g.dart'
            ':(glob)wishlist/lib/**/*.freezed.dart'
            'wishlist/lib/gen'
            ':(glob)wishlist/lib/l10n/arb/app_localizations*.dart'
          )
          changed="$(git status --porcelain -- "${generated[@]}")"
          if [ -n "$changed" ]; then
            echo "$changed"
            git diff -- "${generated[@]}"
            echo "::error::Generated files are out of date: run flutter pub get, then dart run build_runner build --delete-conflicting-outputs, and commit the files listed above."
            exit 1
          fi

      - name: Analyze code
        run: flutter analyze

      # On main, goldens are only checked: a mismatch means a render change
      # that was never reviewed in a PR diff, so the build must fail.
      - name: Run tests
        if: github.event_name != 'pull_request'
        run: flutter test

      # On PRs, goldens are regenerated on Linux and pushed to the branch by
      # commit-goldens, so the PNG changes show up in the PR diff for review.
      - name: Run tests & update goldens
        if: github.event_name == 'pull_request'
        run: flutter test --update-goldens

      - name: Check for golden changes
        if: github.event_name == 'pull_request'
        id: goldens
        run: |
          cd ..
          # status (not diff) so that new, untracked goldens are picked up too
          if [ -z "$(git status --porcelain -- "$GOLDENS")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The artifact root is wishlist/test, the part of the path before the
      # first wildcard: commit-goldens downloads it back there.
      - name: Upload regenerated goldens
        if: steps.goldens.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: goldens
          path: wishlist/test/**/preview/*.png
          if-no-files-found: error
          retention-days: 1

  commit-goldens:
    name: Commit golden files
    needs: test
    if: github.event_name == 'pull_request' && needs.test.outputs.goldens-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Needed to push the regenerated golden files to the PR branch, and to
    # mark the pushed commit as tested
    permissions:
      contents: write
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Download regenerated goldens
        uses: actions/download-artifact@v4
        with:
          name: goldens
          path: wishlist/test

      - name: Commit and push goldens
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git add -- "$GOLDENS"
          if git diff --cached --quiet; then
            echo "No golden change to commit"
            exit 0
          fi
          changed="$(git diff --cached --name-only)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # [skip ci]: GitHub still creates a run for a push made with
          # GITHUB_TOKEN, then holds it until a human approves it. This one
          # would only re-test the goldens this run just produced. PRs are
          # merged with a merge commit, whose own message triggers the CI on
          # main (a squash merge would copy the marker there).
          git commit -m "test: update golden files [skip ci]"
          git push
          # The skipped commit gets no check: report the tests of this run on
          # it, so that the PR head shows them.
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$(git rev-parse HEAD)" \
            -f state=success \
            -f context="Analyze & Test" \
            -f description="Passed before the goldens update, on ${TESTED_SHA::8}" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "### Golden files updated"
            while IFS= read -r file; do echo "- $file"; done <<<"$changed"
          } >> "$GITHUB_STEP_SUMMARY"
