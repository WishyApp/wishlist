name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'test/**'

# Évite les runs en doublon et annule les anciens runs si un nouveau commit est pushé
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
 
jobs:
  analyze:
    name: Analyze & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze code
        run: flutter analyze

  test:
    name: Tests
    runs-on: ubuntu-latest
    # Needed to push the regenerated golden files
    permissions:
      contents: write
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      # On main, goldens are only checked: a mismatch means a render change
      # that was never reviewed in a PR diff, so the build must fail.
      - name: Run tests
        if: github.event_name != 'pull_request'
        run: flutter test

      # On PRs, goldens are regenerated on Linux and pushed to the branch so
      # the PNG changes show up in the PR diff for review.
      - name: Run tests & update goldens
        if: github.event_name == 'pull_request'
        run: flutter test --update-goldens

      - name: Check for golden changes
        if: github.event_name == 'pull_request'
        id: goldens
        run: |
          cd ..
          # status (not diff) so that new, untracked goldens are picked up too
          if [ -z "$(git status --porcelain -- ':(glob)wishlist/test/**/preview/*.png')" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated goldens
        if: steps.goldens.outputs.changed == 'true'
        run: |
          cd ..
          {
            echo "### Golden files updated"
            git status --porcelain -- ':(glob)wishlist/test/**/preview/*.png' | sed 's/^.. /- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'wishlist/test/**/preview/*.png'
          git commit -m "test: update golden files [skip ci]"
          git push
