name: CD

on:
  push:
    tags:
      - 'v*'
  # Lancement manuel pour valider le build (signing, extension iOS) sans
  # publier : les étapes d'upload ne tournent que sur tag ou si publish=true.
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publier sur Google Play / TestFlight'
        type: boolean
        default: false

# Un seul déploiement à la fois, tous tags confondus : deux releases ne
# doivent ni se doubler sur les stores ni migrer la prod en même temps. On ne
# coupe jamais un upload en cours.
concurrency:
  group: cd-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # VERIFY - Analyse, tests et cohérence tag / pubspec avant tout build
  # ============================================================================
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        if: github.ref_type == 'tag'
        run: |
          PUBSPEC_VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Comme ci.yml : sur les fichiers commités, avant la génération.
      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # ============================================================================
  # SUPABASE - Migrations prod, avant les builds
  # ============================================================================
  migrate-database:
    name: Migrate prod database
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: supabase-prod
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only migrations reviewed, validated and applied on dev reach prod:
      # a tag on a commit outside main must not migrate the database.
      - name: Ensure the tag is on main
        if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main, prod migrations are not applied"
            exit 1
          fi

      - name: Push migrations and check drift
        if: vars.SUPABASE_DEPLOY_ENABLED == 'true'
        uses: ./.github/actions/supabase-deploy
        with:
          environment: prod
          project-ref: cbcrtjggsmtwvqljzbnl
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
          # Catch-up of a project changed outside of migrations, see README.
          pre-push-check: ${{ vars.SUPABASE_SKIP_PRE_PUSH_DRIFT_PROD != 'true' }}

  # ============================================================================
  # ANDROID - Build et deploy sur Google Play (Internal Testing)
  # ============================================================================
  build-android:
    name: Build & Deploy Android
    needs: migrate-database
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('wishlist/android/**/*.gradle', 'wishlist/android/gradle/wrapper/gradle-wrapper.properties', 'wishlist/pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/key.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storeFile=key.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Create .env.prod
        run: |
          cat > env/.env.prod << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --dart-define=APP_ENV=prod

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: wishlist/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Upload to Google Play (Internal Testing)
        if: github.event_name == 'push' || inputs.publish
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.raphtang.wishy
          releaseFiles: wishlist/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  # ============================================================================
  # iOS - Build et deploy sur TestFlight
  # ============================================================================
  build-ios:
    name: Build & Deploy iOS
    needs: migrate-database
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: wishlist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # flutter-version-file reads pubspec.yaml with yq: make sure the macOS
      # image has it before Setup Flutter.
      - name: Ensure yq is installed
        run: command -v yq >/dev/null || brew install yq

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: wishlist/pubspec.yaml
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Create .env.prod
        run: |
          cat > env/.env.prod << EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.IOS_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profiles
        run: |
          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > "$PROFILES_DIR/runner.mobileprovision"
          echo "${{ secrets.IOS_SHARE_EXTENSION_PROFILE_BASE64 }}" | base64 -d > "$PROFILES_DIR/share-extension.mobileprovision"
          # Extraire l'UUID de chaque provisioning profile pour l'ExportOptions
          profile_uuid() { /usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(/usr/bin/security cms -D -i "$1")"; }
          echo "PROFILE_UUID=$(profile_uuid "$PROFILES_DIR/runner.mobileprovision")" >> $GITHUB_ENV
          echo "SHARE_EXTENSION_PROFILE_UUID=$(profile_uuid "$PROFILES_DIR/share-extension.mobileprovision")" >> $GITHUB_ENV

      - name: Create ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.raphtang.wishy</key>
                  <string>${PROFILE_UUID}</string>
                  <key>com.raphtang.wishy.ShareExtension</key>
                  <string>${SHARE_EXTENSION_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: wishlist/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('wishlist/ios/Podfile.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist --dart-define=APP_ENV=prod

      - name: Find IPA file
        run: |
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA found in build/ios/ipa"
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: wishlist/${{ env.IPA_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.publish
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: wishlist/${{ env.IPA_PATH }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
